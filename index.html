<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NIS Student Council</title>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://i.ibb.co/GY3CW9g/FAF57133-073-C-4590-8760-6-B8424909423.png" alt="NIS Student Council logo">
    </div>
    <p class="eyebrow">OFFICIAL SOCIAL MEDIA</p>
    <h1>NIS</h1>
    <h2>STUDENT COUNCIL</h2>
    <div class="ornament">
      <span></span>
      <i></i>
      <span></span>
    </div>
    <p class="follow">CONNECT WITH US</p>
    <div class="links">
      <a class="social" href="https://www.tiktok.com/@nis.student.council?_r=1&_t=ZS-9AWcYzVgMsS" target="_blank" rel="noopener noreferrer">
        <span class="label">TikTok</span>
        <span class="handle">@nis.student.council</span>
      </a>
      <a class="social" href="https://instagram.com/nis.student.council?srtk=bmJhamJkMHA3b3cw" target="_blank" rel="noopener noreferrer">
        <span class="label">Instagram</span>
        <span class="handle">@nis.student.council</span>
      </a>
    </div>
    <footer>
      NASR INTERNATIONAL SCHOOL
      <span>STUDENT COUNCIL</span>
    </footer>
  </div>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fbf7ee;
      font-family: Georgia, "Times New Roman", serif;
      color: #760b18;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      background: #fffdf8;
      border: 1px solid #bd9650;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(70, 20, 20, 0.07);
    }
    .logo {
      width: 180px;
      height: 180px;
      max-width: 100%;
      margin: -60px auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fffdf8;
      border: 3px solid #bd9650;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(118, 11, 24, 0.15);
      overflow: hidden;
    }
    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: transparent;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #a17a36;
      font: bold 10px Arial, sans-serif;
      letter-spacing: 3px;
    }
    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.2;
      letter-spacing: 5px;
      color: #760b18;
    }
    h2 {
      margin: 7px 0 20px;
      font: bold 12px Arial, sans-serif;
      letter-spacing: 3px;
      color: #760b18;
    }
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 auto 22px;
    }
    .ornament span {
      width: 42px;
      height: 1px;
      background: #bd9650;
    }
    .ornament i {
      width: 7px;
      height: 7px;
      background: #bd9650;
      transform: rotate(45deg);
    }
    .follow {
      margin: 0 0 20px;
      color: #8c7859;
      font: bold 11px Arial, sans-serif;
      letter-spacing: 3px;
    }
    .links {
      display: grid;
      gap: 13px;
    }
    .social {
      display: block;
      padding: 17px 14px;
      border: 1px solid #bd9650;
      border-radius: 18px;
      background: #760b18;
      color: #fffdf8;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .social:hover, .social:focus-visible {
      background: #5f0711;
      outline: 2px solid #bd9650;
      outline-offset: 3px;
    }
    .label {
      display: block;
      font: bold 16px Arial, sans-serif;
      letter-spacing: 0.3px;
    }
    .handle {
      display: block;
      margin-top: 6px;
      color: #ead4a4;
      font: 10px Arial, sans-serif;
      letter-spacing: 1px;
    }
    footer {
      margin-top: 26px;
      color: #8c7859;
      font: bold 9px Arial, sans-serif;
      letter-spacing: 2px;
      line-height: 1.9;
    }
    footer span {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
    }
    @media (max-width: 360px) {
      .card {
        padding: 28px 18px;
      }
      .logo {
        width: 150px;
        height: 150px;
        margin-top: -50px;
      }
    }
  </style>
</body>
</html>
